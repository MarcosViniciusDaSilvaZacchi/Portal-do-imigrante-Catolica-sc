<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Material de aula · Acolhe Joinville (PAC V)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Base visual do projeto Acolhe Joinville (outro grupo) */

*{box-sizing:border-box;margin:0}
:root{
  --bg:#FFFFFF;--surface:#FFFFFF;--surface-2:#F1F1F1;--ink:#282828;--ink-2:#5C5A5D;--line:#E1DFE4;
  --primary:#9B1536;--primary-ink:#fff;--primary-soft:#F7E7EB;--primary-text:#9B1536;
  --sun:#C0994F;--sun-ink:#2E2300;--sun-soft:#F4E2CB;
  --ok:#0F8F5F;--ok-soft:#D9F3E7;--warn:#8A5F00;--warn-soft:#FBEFD6;--bad:#C91C39;--bad-soft:#FCE3E7;
  --side:#FFFFFF;--side-ink:#5C5A5D;
  --c1:#9B1536;--c2:#F7B943;--c3:#E42141;--c4:#3FB58A;
  --font-body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-head:'Bricolage Grotesque','Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --demoH:40px;color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#180B0F;--surface:#241218;--surface-2:#301A21;--ink:#F5EFF1;--ink-2:#CDB3BA;--line:#45272F;
    --primary:#E8708A;--primary-ink:#2B0A12;--primary-soft:#411A25;--primary-text:#F3919F;
    --sun:#E0BC73;--sun-ink:#2E2300;--sun-soft:#3F3112;
    --ok:#4FD1A0;--ok-soft:#123A2E;--warn:#F2C55C;--warn-soft:#3B3010;--bad:#FF7A88;--bad-soft:#40202B;
    --side:#12070A;--side-ink:#E6D2D7;
    --c1:#E8708A;--c2:#F7B943;--c3:#FF8F5E;--c4:#57C79C;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#180B0F;--surface:#241218;--surface-2:#301A21;--ink:#F5EFF1;--ink-2:#CDB3BA;--line:#45272F;
  --primary:#E8708A;--primary-ink:#2B0A12;--primary-soft:#411A25;--primary-text:#F3919F;
  --sun:#E0BC73;--sun-ink:#2E2300;--sun-soft:#3F3112;
  --ok:#4FD1A0;--ok-soft:#123A2E;--warn:#F2C55C;--warn-soft:#3B3010;--bad:#FF7A88;--bad-soft:#40202B;
  --side:#12070A;--side-ink:#E6D2D7;
  --c1:#E8708A;--c2:#F7B943;--c3:#FF8F5E;--c4:#57C79C;color-scheme:dark;
}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px;border-radius:6px}
.ic{flex:none}
h1,h2,h3{font-family:var(--font-head);line-height:1.1;letter-spacing:-.015em}

/* ---------- barra de demonstração ---------- */
#demo{position:sticky;top:0;z-index:60;height:var(--demoH);background:#9B1536;color:#FBEFF2;font-size:13px;display:flex;gap:6px;align-items:center;padding:0 12px;overflow-x:auto;white-space:nowrap}
#demo span{opacity:.75;margin-right:4px}
#demo button{border:0;background:transparent;color:inherit;padding:5px 12px;border-radius:99px;font-weight:600}
#demo button.on{background:#fff;color:#9B1536}
#demo button:focus-visible{outline-color:#fff}

/* ---------- botões, pills, campos ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:12px 20px;font-weight:700;line-height:1.1;text-decoration:none;white-space:nowrap;transition:transform .12s,filter .12s}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--primary);color:var(--primary-ink)}
.btn-primary:hover{filter:brightness(1.1)}
.btn-sun{background:var(--sun);color:var(--sun-ink)}
.btn-sun:hover{filter:brightness(1.05)}
.btn-line{background:transparent;border:1.5px solid var(--primary);color:var(--primary-text)}
.btn-line:hover{background:var(--primary-soft)}
.btn-soft{background:var(--primary-soft);color:var(--primary-text)}
.btn-sm{padding:8px 12px;font-size:14px;border-radius:8px}
.btn-lg{padding:16px 26px;font-size:17px;border-radius:12px}
.btn[disabled]{opacity:.4;cursor:not-allowed;filter:none}
.linkbtn{background:none;border:0;padding:0;color:var(--primary-text);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--primary-soft);color:var(--primary-text)}
.pill.sun{background:var(--sun);color:var(--sun-ink)}
.field{display:grid;gap:6px}
.field>label,.lbl{font-weight:700;font-size:14.5px}
.hint{font-size:13px;color:var(--ink-2)}
.input,.select{width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);min-height:48px}
.input:disabled,.select:disabled{background:var(--surface-2);color:var(--ink-2);border-color:transparent}
.input:focus,.select:focus{outline:3px solid color-mix(in srgb,var(--primary) 35%,transparent);border-color:var(--primary)}
.err{color:var(--bad);font-size:13.5px;font-weight:600}
.chk{display:flex;gap:12px;align-items:flex-start;font-size:15px;cursor:pointer}
.chk input{width:22px;height:22px;margin-top:1px;accent-color:var(--primary);flex:none}
.opt{display:grid;gap:2px;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 16px}
.opt b{font-size:16px}.opt span{font-size:14px;color:var(--ink-2)}
.opt.on{border-color:var(--primary);background:var(--primary-soft);box-shadow:inset 0 0 0 1px var(--primary)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--primary);border-radius:99px}
.banner{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:12px;background:var(--sun-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--sun) 60%,transparent)}
.banner .ic{margin-top:2px;color:var(--warn)}
.banner.info{background:var(--primary-soft);border-color:transparent}
.banner.info .ic{color:var(--primary-text)}
.av{display:inline-grid;place-items:center;border-radius:50%;font-weight:800;flex:none;font-family:var(--font-head)}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who>div{min-width:0}
.nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{font-size:13px;color:var(--ink-2)}

/* ---------- mapa de vagas (100 pontos) ---------- */
.seats{display:grid;grid-template-columns:repeat(10,1fr);gap:clamp(4px,1.2vw,8px);width:100%}
.seat{aspect-ratio:1;border-radius:50%;background:var(--primary)}
.seat.free{background:transparent;box-shadow:inset 0 0 0 2px var(--line)}
.seat.mine{background:var(--sun);box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--ink);transform:scale(1.05)}
.seat.P{background:var(--ok)}.seat.F{background:var(--bad)}.seat.J{background:var(--sun)}
.seat.none{background:transparent;box-shadow:inset 0 0 0 2px var(--ink-2);opacity:.55}
.seat.risk{background:var(--c3)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}

/* ---------- área pública ---------- */
.pub-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px clamp(16px,4vw,48px);max-width:1240px;margin:auto}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--font-head);font-weight:800;font-size:21px;letter-spacing:-.01em;background:none;border:0;color:inherit;padding:0}
.logo small{display:block;font:500 12px var(--font-body);letter-spacing:0;color:var(--ink-2);margin-top:-2px}
.ph-r{display:flex;gap:10px;align-items:center}
.lang{display:inline-flex;gap:6px;align-items:center;background:none;border:0;font-weight:600;padding:8px 10px;border-radius:8px;color:var(--ink-2)}
.lang:hover{background:var(--surface-2)}
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(300px,.75fr);gap:clamp(24px,5vw,72px);align-items:center;max-width:1240px;margin:auto;padding:clamp(16px,3vw,40px) clamp(16px,4vw,48px) 56px}
.hi-row{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;margin-bottom:18px;font-family:var(--font-head);font-weight:600;color:var(--ink-2)}
.hi-row span:nth-child(1){font-size:24px;color:var(--primary-text)}
.hi-row span:nth-child(2){font-size:19px}
.hi-row span:nth-child(3){font-size:28px;color:var(--ink)}
.hi-row span:nth-child(4){font-size:17px}
.hi-row span:nth-child(5){font-size:22px;color:var(--primary-text)}
.display{font-family:var(--font-head);font-weight:800;font-stretch:78%;font-size:clamp(46px,9vw,104px);line-height:.9;letter-spacing:-.025em;text-wrap:balance}
.lead{font-size:clamp(17px,2vw,20px);max-width:52ch;color:var(--ink-2);margin:22px 0 28px}
.cta-row{display:flex;flex-wrap:wrap;gap:12px}
.vac{background:var(--surface);border:1.5px solid var(--primary);border-radius:22px;padding:22px;display:grid;gap:16px;box-shadow:8px 8px 0 var(--primary-soft)}
.vac h2{font-size:22px;font-weight:700}
.vac p{font-size:15px;color:var(--ink-2)}
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;max-width:1240px;margin:auto;padding:0 clamp(16px,4vw,48px) 24px}
.strip figure{display:grid;gap:10px}
.strip svg{width:100%;height:auto;display:block;border-radius:18px}
.strip figcaption{font-size:14px;color:var(--ink-2)}
.strip figcaption b{color:var(--ink);font-family:var(--font-head);font-size:18px;display:block}
.sec{max-width:1240px;margin:auto;padding:clamp(40px,6vw,72px) clamp(16px,4vw,48px)}
.sec h2{font-size:clamp(30px,5vw,52px);font-stretch:85%;font-weight:800;text-wrap:balance}
.band{background:var(--surface);border-block:1px solid var(--line)}
.about{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(24px,5vw,64px);align-items:center}
.about p{max-width:60ch;margin-top:16px;font-size:17px}
.about ul{list-style:none;padding:0;margin:22px 0 0;display:grid;gap:12px}
.about li{display:flex;gap:12px;align-items:center;font-weight:600}
.about li .ic{background:var(--ok-soft);color:var(--ok);border-radius:50%;padding:4px;width:28px;height:28px}
.about svg.scene{width:100%;height:auto;border-radius:22px;display:block}
.path{list-style:none;padding:0;margin:36px 0 0;display:grid;grid-template-columns:repeat(4,1fr);gap:24px;position:relative;counter-reset:s}
.path::before{content:"";position:absolute;left:20px;right:20px;top:20px;border-top:3px dashed var(--line)}
.path li{position:relative;display:grid;gap:8px;align-content:start}
.path .n{width:42px;height:42px;border-radius:50%;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;font:800 19px var(--font-head);position:relative}
.path li:nth-child(3) .n{background:var(--sun);color:var(--sun-ink)}
.path b{font:700 20px var(--font-head)}
.path p{color:var(--ink-2);font-size:15px}
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin-top:32px}
.rules div{border-left:5px solid var(--primary);padding-left:18px}
.rules div:nth-child(2){border-color:var(--sun)}
.rules div:nth-child(3){border-color:var(--c3)}
.rules b{font:700 22px var(--font-head);display:block;margin-bottom:6px}
.rules p{color:var(--ink-2)}
.cta-band{background:var(--primary);color:var(--primary-ink);border-radius:28px;padding:clamp(28px,5vw,56px);display:flex;flex-wrap:wrap;gap:20px;justify-content:space-between;align-items:center;margin:0 clamp(16px,4vw,48px)}
.cta-band h2{font-size:clamp(28px,4.5vw,46px);max-width:18ch;font-stretch:85%;font-weight:800}
.cta-band .btn-sun{font-size:17px}
footer.foot{max-width:1240px;margin:auto;padding:40px clamp(16px,4vw,48px);color:var(--ink-2);font-size:14px;display:flex;flex-wrap:wrap;gap:8px 32px;justify-content:space-between}

/* ---------- cadastro ---------- */
.wrap-narrow{max-width:680px;margin:0 auto;padding:8px clamp(16px,4vw,32px) 64px}
.wsteps{display:flex;gap:8px;margin:8px 0 28px}
.wsteps i{flex:1;height:6px;border-radius:99px;background:var(--line)}
.wsteps i.on{background:var(--primary)}
.wtitle{font:800 clamp(30px,6vw,44px)/1 var(--font-head);font-stretch:85%;margin-bottom:6px}
.form{display:grid;gap:18px;margin:24px 0}
.actions{display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap}
.opts{display:grid;gap:10px}
.ticket{display:grid;grid-template-columns:1fr auto;background:var(--surface);border:1.5px solid var(--ink);border-radius:20px;overflow:hidden;margin:24px 0}
.ticket .main{padding:22px 22px 24px;display:grid;gap:6px}
.ticket .main small{color:var(--ink-2);font-size:14px}
.ticket .main h2{font-size:clamp(22px,4.5vw,30px);font-stretch:85%}
.ticket .stub{position:relative;border-left:2px dashed var(--ink);padding:22px 24px;display:grid;place-items:center;text-align:center;background:var(--sun);color:var(--sun-ink);min-width:130px}
.ticket .stub::before,.ticket .stub::after{content:"";position:absolute;left:-11px;width:20px;height:20px;border-radius:50%;background:var(--bg)}
.ticket .stub::before{top:-11px}.ticket .stub::after{bottom:-11px}
.ticket .stub b{font:800 clamp(44px,10vw,64px)/1 var(--font-head);font-stretch:80%;display:block}
.ticket.wait .stub{background:var(--surface-2);color:var(--ink)}
.todo{display:grid;gap:12px;margin:0;padding:0;list-style:none}
.todo li{display:flex;gap:12px;align-items:flex-start}
.todo .ic{background:var(--primary-soft);color:var(--primary-text);border-radius:50%;padding:5px;width:30px;height:30px}
.simbox{border:1.5px dashed var(--ink-2);border-radius:12px;padding:14px 16px;margin-top:20px;font-size:14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.login-box{max-width:600px;margin:0 auto;padding:8px clamp(16px,4vw,24px) 64px}
.tabs{display:inline-flex;justify-self:start;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px;max-width:100%;overflow-x:auto}
.tabs button{border:0;background:none;font-weight:700;padding:9px 14px;border-radius:9px;color:var(--ink-2);white-space:nowrap;font-size:14.5px}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(10,17,48,.15)}
.tabs .cnt{opacity:.7;font-weight:600;margin-left:4px}

/* ---------- shell dos painéis ---------- */
.shell{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:calc(100vh - var(--demoH))}
.side{position:sticky;top:var(--demoH);height:calc(100vh - var(--demoH));background:var(--side);color:var(--side-ink);padding:22px 14px;display:flex;flex-direction:column;gap:4px;border-right:1px solid var(--line)}
.side .logo{color:var(--ink);margin:0 8px 22px;font-size:19px;white-space:nowrap}
.side .logo small{color:var(--side-ink)}
.nav-item{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:10px;font-weight:600;color:var(--side-ink);border:0;background:none;text-align:left;width:100%;position:relative}
.nav-item:hover{background:var(--surface-2)}
.nav-item.on{background:var(--primary-soft);color:var(--primary-text)}
.nav-item.on::before{content:"";position:absolute;left:-14px;top:10px;bottom:10px;width:5px;border-radius:0 4px 4px 0;background:var(--primary)}
.side .me{margin-top:auto;display:flex;gap:10px;align-items:center;padding:12px 8px;border-top:1px solid var(--line)}
.side .me .nm{color:var(--ink);font-size:14px}
.side .me .sub{color:var(--side-ink);font-size:12.5px}
.side .me button{margin-left:auto;background:none;border:0;color:var(--side-ink);padding:8px;border-radius:8px}
.side .me button:hover{background:var(--surface-2)}
.main{padding:clamp(20px,3vw,36px) clamp(16px,3vw,40px) 56px;min-width:0;max-width:1240px;width:100%}
.topm,.bnav{display:none}
.phead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:22px}
.phead h1{font-size:clamp(30px,5vw,44px);font-weight:800;font-stretch:85%}
.phead p{color:var(--ink-2);margin-top:4px}
.stack{display:grid;gap:18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:grid;gap:2px}
.kpi .v{font:800 34px/1.05 var(--font-head);font-stretch:85%}
.kpi .l{font-size:14px;color:var(--ink-2);font-weight:600}
.kpi .d{font-size:13px;color:var(--ink-2)}
.hero-me{background:var(--primary);color:var(--primary-ink);border-radius:22px;padding:clamp(20px,3vw,32px);display:grid;grid-template-columns:1fr 200px;gap:24px;align-items:center}
.hero-me h1{font-size:clamp(32px,5vw,50px);font-stretch:80%;font-weight:800}
.hero-me p{margin-top:8px;max-width:46ch;opacity:.92}
.hero-me .pill{background:rgba(255,255,255,.18);color:inherit}
.hero-me .seat{background:rgba(255,255,255,.35)}
.hero-me .seat.mine{background:var(--sun);box-shadow:0 0 0 3px var(--primary),0 0 0 5px #fff}
.hero-me .seat.free{background:transparent;box-shadow:inset 0 0 0 2px rgba(255,255,255,.4)}
.hero-me .btn-sun{margin-top:18px}
.ring{position:relative;width:88px;height:88px;flex:none}
.ring svg{display:block}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:800 20px var(--font-head)}
.stat-row{display:flex;align-items:center;gap:16px}
.stat-row h3{font-size:18px}
.stat-row p{font-size:14px;color:var(--ink-2)}
.lrow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.lrow .n{width:40px;height:40px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font:800 17px var(--font-head)}
.lrow.next .n{background:var(--sun);color:var(--sun-ink)}
.lrow b{display:block}
.lrow .r{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.drow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:14px;align-items:center;padding:16px;border-bottom:1px solid var(--line)}
.drow:last-child{border-bottom:0}
.drow .ico{width:44px;height:44px;border-radius:12px;background:var(--primary-soft);color:var(--primary-text);display:grid;place-items:center}
.drow.locked .ico{background:var(--surface-2);color:var(--ink-2)}
.drow .note{font-size:13.5px;color:var(--bad);margin-top:2px}
.pf-head{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.pf-head h2{font-size:26px;font-weight:800}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:16px 0}
.toolbar .input,.toolbar .select{width:auto;min-height:44px}
.toolbar .grow{flex:1;min-width:180px;position:relative}
.toolbar .grow .input{width:100%;padding-left:40px}
.toolbar .grow .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-2)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;position:relative}
.chip{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 14px;font-weight:700;text-align:center;line-height:1.2;color:var(--ink)}
.chip small{display:block;font-weight:500;color:var(--ink-2);font-size:12px}

function prof(){
  const c=C(), L=c.lessons, l=L.find(x=>x.id===S.sel)||L[0];
  const rel=L.filter(x=>x.released).length, mats=L.reduce((a,x)=>a+x.mats.length,0), drafts=L.filter(x=>!x.released&&x.mats.length).length;
  const [st,stl]=status(l);
  $('#main').innerHTML=`
  <div class="phead"><div><div class="mod-tag">${ic('layers',14)} Módulo Material de aula</div><h1>Material de aula</h1><p>Publique apostilas, listas, slides e vídeos de cada aula e escolha quando a turma pode ver.</p></div></div>
  <div class="stack">
   ${chips()}
   <div class="kpis">
    <div class="kpi k-ok"><span class="ico">${ic('ok',22)}</span><div><b>${rel} de ${L.length}</b><span>aulas liberadas para a turma</span></div></div>
    <div class="kpi k-pr"><span class="ico">${ic('doc',22)}</span><div><b>${mats}</b><span>materiais publicados</span></div></div>
    <div class="kpi k-sun"><span class="ico">${ic('clock',22)}</span><div><b>${drafts}</b><span>${drafts===1?'aula em rascunho':'aulas em rascunho'}</span></div></div>
   </div>
   <div class="mgrid">
    <div class="card" style="padding:14px">
     <div style="display:flex;justify-content:space-between;align-items:center;padding:4px 6px 10px"><b>Aulas do curso</b><span class="sub" style="display:flex;gap:10px;align-items:center"><span class="dot ok"></span>Liberada <span class="dot draft"></span>Rascunho</span></div>
     <div class="alist">${L.map(x=>{const [s]=status(x);return `<button class="arow ${x.id===l.id?'on':''}" data-lesson="${x.id}"><span class="n">${x.id}</span><span><b>${x.name}</b><small>${x.date} · ${x.mats.length} ${x.mats.length===1?'material':'materiais'}</small></span><span class="dot ${s}"></span></button>`}).join('')}</div>
    </div>
    <div class="card">
     <div class="dhead">
      <div><span class="pill ${st==='ok'?'ok':st==='draft'?'warn':''}">${stl}</span><h2 style="margin-top:8px">Aula ${l.id}: ${l.name}</h2><div class="sub">${c.name} · ${l.date}</div></div>
      <div class="rel"><button class="switch ${l.released?'on':''}" data-toggle="${l.id}" aria-label="Liberar aula"></button><div><b>${l.released?'Liberada para os alunos':'Oculta para os alunos'}</b><small>${l.released?'A turma já vê os materiais desta aula.':'Só você vê. Ligue quando quiser liberar.'}</small></div></div>
     </div>
     <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><b>Materiais da aula</b><button class="btn btn-primary btn-sm" data-modal="add">${ic('plus',16)}Adicionar material</button></div>
     ${l.mats.length?l.mats.map((m,i)=>`<div class="mrow"><span class="ico t-${m.t}">${ic(TYPES[m.t].ic,22)}</span><div style="min-width:0"><b>${m.title}</b><div class="meta">${TYPES[m.t].lb} · ${m.size} · enviado em ${m.date}</div></div><div class="r"><button class="btn btn-ghost btn-sm iconbtn" title="Visualizar" data-modal="view">${ic('eye',16)}</button><button class="btn btn-ghost btn-sm" data-modal="rep">${ic('swap',16)}Substituir</button><button class="btn btn-ghost btn-sm iconbtn" title="Remover" data-modal="del">${ic('trash',16)}</button></div></div>`).join('')
      :`<div class="empty">${ic('up',28)}<b>Nenhum material nesta aula</b>Adicione a apostila, uma lista de exercícios, slides ou o link de um vídeo.<div style="margin-top:14px"><button class="btn btn-soft btn-sm" data-modal="add">${ic('plus',16)}Adicionar material</button></div></div>`}
     <div class="note" style="margin-top:16px">${ic('info',18)}<span>Arquivos em PDF de até 10 MB. Ao substituir um arquivo, o link que os alunos já têm continua funcionando.</span></div>
    </div>
   </div>
  </div>`;
}

function aluno(){
  const c=C(), L=c.lessons.filter(x=>x.released), last=L[L.length-1];
  const all=L.flatMap(x=>x.mats), seen=all.filter(m=>m.seen).length, pct=all.length?Math.round(seen/all.length*100):0;
  const next=c.lessons.find(x=>!x.released);
  $('#main').innerHTML=`
  <div class="phead"><div><div class="mod-tag">${ic('layers',14)} Módulo Material de aula</div><h1>Material de aula</h1><p>Apostilas, listas, slides e vídeos das aulas que o seu professor já liberou.</p></div>
   <div class="prog"><span class="bar"><i style="width:${pct}%"></i></span><span><b style="color:var(--ink)">${seen} de ${all.length}</b> materiais abertos</span></div></div>
  <div class="stack">
   ${chips()}
   ${last?`<div class="resume"><div><small>Material mais recente</small><h2>Aula ${last.id}: ${last.name}</h2><p>${last.mats.length} ${last.mats.length===1?'material novo':'materiais novos'} · liberado em ${last.date}</p></div><button class="btn btn-sun btn-lg" data-modal="view">${ic('eye',18)}Abrir agora</button></div>`:''}
   ${[...L].reverse().map(x=>`<div class="lesson ${x===last?'new':''}"><div class="lh"><span class="n">${x.id}</span><div><b>Aula ${x.id}: ${x.name}</b><div class="sub">${x.date} · ${x.mats.length} ${x.mats.length===1?'material':'materiais'}</div></div>${x===last?'<span class="pill sun">Nova</span>':''}</div>
     ${x.mats.map(m=>`<div class="mrow"><span class="ico t-${m.t}">${ic(TYPES[m.t].ic,22)}</span><div style="min-width:0"><b>${m.title}</b><div class="meta">${TYPES[m.t].lb} · ${m.size} ${m.seen?`· <span class="seen">${ic('ok',13)} aberto</span>`:''}</div></div><div class="r"><button class="btn btn-soft btn-sm" data-modal="view">${ic(m.t==='video'?'play':'eye',16)}${m.t==='video'?'Assistir':'Abrir'}</button>${m.t==='video'?'':`<button class="btn btn-ghost btn-sm iconbtn" title="Baixar" data-toast="Download iniciado">${ic('dl',16)}</button>`}</div></div>`).join('')}</div>`).join('')}
   ${next?`<div class="lesson locked"><div class="lh"><span class="n">${ic('lock',18)}</span><div><b>Aula ${next.id}: ${next.name}</b><div class="sub">${next.date} · o professor libera o material perto da aula</div></div><span class="pill">Em breve</span></div></div>`:''}
  </div>`;
}

function modal(kind){
  const l=C().lessons.find(x=>x.id===S.sel)||C().lessons[0];
  let h='';
  if(kind==='add'||kind==='err'){
    const err=kind==='err';
    h=`<div class="dlg"><div class="mh"><div><h3>Adicionar material</h3><p>Aula ${l.id}: ${l.name}</p></div><button class="xbtn" data-close>${ic('x')}</button></div>
    <div class="mb">
     <div class="field"><span class="lbl">Tipo de material</span><div class="typeopts">${Object.entries(TYPES).map(([k,t],i)=>`<button class="${i===0?'on':''}" data-type>${ic(t.ic,22)}${t.lb==='Lista de exercícios'?'Lista':t.lb}</button>`).join('')}</div></div>
     <div class="field"><label>Título</label><input class="input" value="${err?'Apostila: saúde e emergências (versão completa)':'Apostila: saúde e emergências'}"></div>
     <div class="field"><label>Arquivo</label>
      ${err?`<div class="drop err">${ic('alert',28)}<b>Arquivo muito grande: 14,2 MB</b><small>O limite é 10 MB. Diminua o PDF ou divida em duas partes.</small><button class="btn btn-line btn-sm" style="margin-top:6px">Escolher outro arquivo</button></div>`
       :`<div class="drop">${ic('up',28)}<b>Arraste o PDF aqui ou clique para escolher</b><small>Somente PDF · até 10 MB</small></div>`}
     </div>
     <label class="chk" style="display:flex;gap:10px;align-items:flex-start"><input type="checkbox" ${l.released?'checked':''}><span><b>Mostrar para os alunos assim que salvar</b><span class="sub" style="display:block">Se a aula ainda estiver oculta, o material fica em rascunho junto com ela.</span></span></label>
    </div>
    <div class="mf"><button class="btn btn-ghost" data-close>Cancelar</button><button class="btn btn-primary" ${err?'disabled':''} data-close data-toast="Material adicionado">${ic('plus',16)}Adicionar</button></div></div>`;
  } else if(kind==='rep'){
    h=`<div class="dlg"><div class="mh"><div><h3>Substituir arquivo</h3><p>Aula ${l.id}: ${l.name}</p></div><button class="xbtn" data-close>${ic('x')}</button></div>
    <div class="mb">
     <div class="field"><span class="lbl">Arquivo atual</span><div class="filecard"><span class="ico t-apostila" style="width:40px;height:40px;border-radius:10px;display:grid;place-items:center">${ic('doc',20)}</span><div><b>Apostila: saúde e emergências</b><div class="sub">saude_emergencias_v1.pdf · 1,6 MB · enviado em 19/09</div></div></div></div>
     <div class="field"><span class="lbl">Novo arquivo</span><div class="filecard" style="border-color:var(--ok)"><span class="ico t-lista" style="width:40px;height:40px;border-radius:10px;display:grid;place-items:center">${ic('ok',20)}</span><div><b>saude_emergencias_v2.pdf</b><div class="sub">1,9 MB · pronto para enviar</div></div></div></div>
     <div class="note ok">${ic('info',18)}<span>O link que os alunos já têm continua o mesmo. Eles passam a ver a versão nova automaticamente.</span></div>
    </div>
    <div class="mf"><button class="btn btn-ghost" data-close>Cancelar</button><button class="btn btn-primary" data-close data-toast="Arquivo substituído">${ic('swap',16)}Substituir</button></div></div>`;
  } else if(kind==='del'){
    h=`<div class="dlg" style="width:min(460px,100%)"><div class="mh"><div><h3>Remover material?</h3><p>Apostila: saúde e emergências</p></div><button class="xbtn" data-close>${ic('x')}</button></div>
    <div class="mb"><div class="note bad">${ic('alert',18)}<span>Os alunos deixam de ver este material. Esta ação não pode ser desfeita.</span></div></div>
    <div class="mf"><button class="btn btn-ghost" data-close>Cancelar</button><button class="btn btn-primary" style="background:var(--bad)" data-close data-toast="Material removido">${ic('trash',16)}Remover</button></div></div>`;
  } else if(kind==='view'){
    h=`<div class="dlg wide"><div class="mh" style="padding-bottom:14px"><div><h3>Apostila: cumprimentos e apresentações</h3><p>Curso de Português · Aula 1 · PDF · 1,4 MB</p></div><button class="xbtn" data-close>${ic('x')}</button></div>
    <div class="viewer"><div class="thumbs">${[1,2,3,4].map(n=>`<div class="thumb ${n===1?'on':''}"><i style="width:60%"></i><i></i><i style="width:80%"></i><i></i><i style="width:50%"></i><small>Página ${n}</small></div>`).join('')}</div>
     <div class="stage"><div class="page"><div class="ph"><img src="${LOGO}" alt=""><div><b style="font-size:13px">Projeto Imigrante Cidadão</b><div style="font-size:11px;color:#5C5A5D">Católica SC · Joinville</div></div></div>
      <span class="tag">APOSTILA · AULA 1</span><h4>Cumprimentos e apresentações</h4>
      <b>1. Como cumprimentar</b><p>Bom dia! (de manhã, até 12h) · Boa tarde! (das 12h até escurecer) · Boa noite! (à noite)</p>
      <b>2. Diálogo</b><div class="dlgbox">— Olá! Como você se chama?<br>— Meu nome é Jean. Sou do Haiti e moro em Joinville.<br>— Muito prazer, Jean! Seja bem-vindo.</div>
      <b>3. Pratique</b><p>Apresente-se para um colega: diga seu nome, seu país e há quanto tempo está no Brasil.</p></div></div></div>
    <div class="vbar"><div class="pg"><button class="btn btn-ghost btn-sm iconbtn">${ic('left',16)}</button>Página <b style="color:var(--ink)">1</b> de 4<button class="btn btn-ghost btn-sm iconbtn">${ic('right',16)}</button><span style="width:12px"></span><button class="btn btn-ghost btn-sm iconbtn">${ic('zout',16)}</button>100%<button class="btn btn-ghost btn-sm iconbtn">${ic('zin',16)}</button></div>
     <div style="display:flex;gap:8px"><button class="btn btn-ghost btn-sm" data-close>Fechar</button><button class="btn btn-primary btn-sm" data-toast="Download iniciado">${ic('dl',16)}Baixar PDF</button></div></div></div>`;
  }
  const ov=$('#ov'); ov.innerHTML=h; ov.hidden=false;
}
function toast(t){const el=$('#toast'); el.innerHTML=ic('ok',18)+t; el.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>el.hidden=true,1800);}
function render(){ side(); S.view==='prof'?prof():aluno(); document.querySelectorAll('#demo [data-view]').forEach(b=>b.classList.toggle('on',b.dataset.view===S.view)); }

document.addEventListener('click',e=>{
  const t=e.target.closest('button'); if(!t) return;
  if(t.dataset.view){S.view=t.dataset.view; $('#ov').hidden=true; render(); return;}
  if(t.id==='themeBtn'){S.theme=S.theme==='light'?'dark':'light'; document.documentElement.dataset.theme=S.theme; t.textContent='Tema: '+(S.theme==='light'?'claro':'escuro'); return;}
  if(t.dataset.course){S.course=t.dataset.course; S.sel=S.course==='pt'?9:4; render(); return;}
  if(t.dataset.lesson){S.sel=+t.dataset.lesson; render(); return;}
  if(t.dataset.toggle){const l=C().lessons.find(x=>x.id===+t.dataset.toggle); l.released=!l.released; render(); toast(l.released?'Aula liberada para os alunos':'Aula ocultada dos alunos'); return;}
  if(t.dataset.type!==undefined){t.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('on')); t.classList.add('on'); return;}
  if(t.dataset.modal){modal(t.dataset.modal); return;}
  if(t.dataset.other){toast('Esta área é do módulo de outro grupo do projeto'); return;}
  if(t.dataset.toast) toast(t.dataset.toast);
  if(t.hasAttribute('data-close')) $('#ov').hidden=true;
});
$('#ov').addEventListener('click',e=>{if(e.target.id==='ov') e.currentTarget.hidden=true;});
document.addEventListener('keydown',e=>{if(e.key==='Escape') $('#ov').hidden=true;});
document.documentElement.dataset.theme='light';
render();

</script>
</body>
</html>
